<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Om Shree Krishna Caterer — Catering &amp; Equipment Rental</title>
    <meta name="description" content="Om Shree Krishna Caterer provides catering and catering equipment rental services for weddings, parties, corporate events and celebrations in Kolkata and Howrah." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      header a .font-display,
      footer .font-display { font-size: 0 !important; }
      header a .font-display::after {
        content: "Om Shree Krishna Caterer";
        font-size: 1.5rem;
        line-height: 1.25;
      }
      footer .font-display::after {
        content: "Om Shree Krishna Caterer";
        font-size: 1.25rem;
        line-height: 1.25;
      }
      @media (max-width: 639px) {
        header a .font-display::after { font-size: 1.25rem; }
      }
    </style>
    <script>
      (() => {
        const clean = () => {
          document.title = document.title.replace(/Saveur\s*&?\s*Co\.?/gi, "Om Shree Krishna Caterer");
          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          const nodes = [];
          while (walker.nextNode()) nodes.push(walker.currentNode);
          nodes.forEach((node) => {
            if (!node.nodeValue) return;
            let v = node.nodeValue;
            v = v.replace(/Saveur\s*&?\s*Co\.?/gi, "Om Shree Krishna Caterer");
            v = v.replace(/Saveur/gi, "Om Shree Krishna Caterer");
            v = v.replace(/Brooklyn/gi, "Howrah").replace(/NYC/gi, "Kolkata");
            v = v.replace(/hello@saveurandco\.com/gi, "");
            v = v.replace(/\(718\)\s*555-0142/g, "+91 94332 51917");
            v = v.replace(/221 Kent Ave, Brooklyn NY/gi, "32, Jelia Para Ln, Babudanga, Salkia, Howrah, West Bengal 711106");
            if (v !== node.nodeValue) node.nodeValue = v;
          });
        };
        clean();
        document.addEventListener("DOMContentLoaded", clean);
        new MutationObserver(clean).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
      })();
    </script>
    <script type="module" crossorigin src="/catering-showcase/assets/static-DE8glphK.js"></script>
    <link rel="stylesheet" crossorigin href="/catering-showcase/assets/styles-Wj3YGKOz.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
